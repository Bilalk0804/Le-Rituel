# Nginx config for the Le Rituel frontend container.
# - Serves the CRA build as a SPA (all routes fall back to index.html)
# - Proxies /api/ to the backend service so the browser only ever talks
#   to a single origin (no CORS/cookie friction).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell — always fetch fresh HTML + service worker.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Long-cache the immutable CRA bundles.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Proxy API to the backend container. Assumes the docker-compose
    # service is named "backend" and listens on port 8001.
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # SPA fallback: every other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
